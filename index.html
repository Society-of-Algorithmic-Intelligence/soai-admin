<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - SoAI</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Consume ?redirect=... added by 404.html so deep links survive GitHub Pages.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (!redirect) return;
        try {
          var target = decodeURIComponent(redirect);
          if (target.indexOf('/soai-admin/') !== 0) target = '/soai-admin/';
          window.history.replaceState(null, '', target);
        } catch (e) {
          window.history.replaceState(null, '', '/soai-admin/');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
